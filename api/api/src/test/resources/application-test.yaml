# 테스트 프로필: MySQL 대신 H2 인메모리 DB 를 쓴다. (@ActiveProfiles("test"))
spring:
  datasource:
    # MySQL 호환 모드. user 는 H2 예약어라 NON_KEYWORDS 로 풀어준다.
    url: jdbc:h2:mem:mainichi;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

kakao:
  client-id: test-client-id

logging:
  level:
    org.hibernate.SQL: warn
